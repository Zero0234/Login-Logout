{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            background: radial-gradient(circle at center, #87CEEB 0%, #0061ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 22px;
        }
    </style>
</head>
<body>

<div id="unified-msg-container" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; text-align: center; width: 100%; pointer-events: none;">
    {% if messages %}
        {% for message in messages %}
            {% if "error" in message.tags %}
                <div class="server-error" style="color: #ff4d4d; background: rgba(0,0,0,0.8); display: inline-block; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-bottom: 5px; pointer-events: auto;">
                    {{ message }}
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}
    <div id="js-message" style="color: #ff4d4d; background: rgba(0,0,0,0.8); display: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; pointer-events: auto; width: max-content; margin: 0 auto;"></div>
</div>

<div class="glass-card">
    <form id="main-form" method="POST">
        {% csrf_token %}
        
        <h3>Who is entering the Netlab?</h3>
        
        <div class="role-buttons">
            <label><input type="radio" name="role" value="STUDENT" onclick="toggleFields('student')" {% if selected_role != 'GUEST' %}checked{% endif %}> Student</label>
            <label><input type="radio" name="role" value="GUEST" onclick="toggleFields('guest')" {% if selected_role == 'GUEST' %}checked{% endif %}> Guest</label>
        </div>

        <div id="name-section">
            <input type="text" name="name" id="name_field" placeholder="Full Name" value="{{ name_val }}">
        </div>

        <div id="id-section">
            <input type="text" name="id_number" id="id_field" placeholder="Student ID Number" value="{{ id_val }}">
        </div>

        <button type="button" onclick="verifyEntry()">Login</button>
    </form>
</div>

<div id="studentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:15px; text-align:center; min-width:300px; box-shadow: 0px 4px 15px rgba(0,0,0,0.3);">
        <h3 style="margin-top:0; color:#555;">Is this your name?</h3>
        <h1 id="pulled_name" style="color:#2c3e50; margin:20px 0;"></h1>
        
        <div style="display:flex; justify-content:space-around; margin-top:20px;">
            <button type="button" onclick="confirmStudent()" style="background:#28a745; color:white; border:none; padding:10px 30px; border-radius:5px; cursor:pointer; font-weight:bold;">YES</button>
            <button type="button" onclick="closeStudentModal()" style="background:#dc3545; color:white; border:none; padding:10px 30px; border-radius:5px; cursor:pointer; font-weight:bold;">NO</button>
        </div>
    </div>
</div>

<div id="successModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:15px; text-align:center; min-width:350px; box-shadow: 0px 10px 25px rgba(0,0,0,0.4); border-top: 8px solid #28a745;">
        <div style="font-size: 50px; color: #28a745; margin-bottom: 10px;">✓</div>
        <h2 style="margin: 0 0 15px 0; color: #2c3e50;">Success!</h2>
        <p id="success_message_text" style="color: #555; font-size: 18px; margin-bottom: 25px; font-weight: normal;"></p>
        <button type="button" onclick="closeSuccessModal()" style="background:#28a745; color:white; border:none; padding:12px 40px; border-radius:5px; cursor:pointer; font-weight:bold; font-size: 16px;">OK</button>
    </div>
</div>

<script>
    // --- NEW: Handle "Enter" Key Submission ---
    document.getElementById('main-form').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); // Stop default form submit
            verifyEntry(); // Run our custom validation instead
        }
    });

    function toggleFields(role) {
        const idSection = document.getElementById('id-section');
        const nameSection = document.getElementById('name-section');
        const idField = document.getElementById('id_field');
        const nameField = document.getElementById('name_field');
        const jsMessage = document.getElementById('js-message');

        // Clear ANY errors when switching tabs
        if (jsMessage) jsMessage.style.display = 'none';
        document.querySelectorAll('.server-error').forEach(msg => msg.style.display = 'none');

        if (role === 'guest' || role === 'GUEST') {
            idSection.style.display = 'none';
            idField.required = false;
            nameSection.style.display = 'block';
            nameField.required = true;
        } else {
            idSection.style.display = 'block';
            idField.required = true;
            nameSection.style.display = 'none';
            nameField.required = false;
        }
    }

    window.onload = function() {
        // Initialize based on Django context
        const selectedRole = "{{ selected_role|default:'STUDENT' }}".toLowerCase();
        toggleFields(selectedRole);

        let successMessage = "";
        {% if messages %}
            {% for message in messages %}
                {% if "success" in message.tags %}
                    successMessage = "{{ message|escapejs }}";
                {% endif %}
            {% endfor %}
        {% endif %}

        if (successMessage !== "") {
            document.getElementById('success_message_text').innerText = successMessage;
            document.getElementById('successModal').style.display = 'flex';
        }
    };

    function verifyEntry() {
        const idInput = document.getElementById('id_field').value;
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        
        // Clear previous errors on new click
        document.getElementById('js-message').style.display = 'none';
        document.querySelectorAll('.server-error').forEach(msg => msg.style.display = 'none');

        if (selectedRole === 'GUEST') {
            const nameInput = document.getElementById('name_field').value;
            if (!nameInput) {
                showJsError("Please enter your name.");
                return;
            }
            document.getElementById('main-form').submit();
            return;
        }

        if (!idInput) {
            showJsError("Please enter your Student ID.");
            return;
        }

        if (/[a-zA-Z]/.test(idInput)) {
            showJsError("ID Number must contain only numbers.");
            return;
        }

        fetch(`/lookup/?id_number=${idInput}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('pulled_name').innerText = data.name;
                    document.getElementById('studentModal').style.display = 'flex';
                } else {
                    showJsError("Student ID not found in the master list.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showJsError("An error occurred. Please check the server.");
            });
    }

    function showJsError(messageText) {
        const jsMessage = document.getElementById('js-message');
        jsMessage.innerText = messageText;
        jsMessage.style.display = 'block';
    }

    // --- RESTORED MISSING FUNCTIONS ---
    function confirmStudent() {
        document.getElementById('main-form').submit();
    }

    function closeStudentModal() {
        document.getElementById('studentModal').style.display = 'none';
        document.getElementById('id_field').value = "";
        document.getElementById('id_field').focus();
    }

    function closeSuccessModal() {
        document.getElementById('successModal').style.display = 'none';
        // Clear fields on OK
        document.getElementById('id_field').value = "";
        document.getElementById('name_field').value = "";
    }
</script>
</body>
</html>
