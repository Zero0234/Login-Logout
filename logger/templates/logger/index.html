{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="brand-text left-text">Netlab</div>
<div class="brand-text right-text">Netlab</div>

<div id="unified-msg-container">
    {% if messages %}
        {% for message in messages %}
            {% if "error" in message.tags %}
                <div class="server-error">{{ message }}</div>
            {% endif %}
        {% endfor %}
    {% endif %}
    <div id="js-message"></div>
</div>

<div class="glass-card">
    <form id="main-form" method="POST">
        {% csrf_token %}
        
        <h3>Netlab Login</h3>
        
        <div class="role-buttons">
            <label><input type="radio" name="role" value="STUDENT" onclick="toggleFields('student')" {% if selected_role != 'GUEST' %}checked{% endif %}> Student</label>
            <label><input type="radio" name="role" value="GUEST" onclick="toggleFields('guest')" {% if selected_role == 'GUEST' %}checked{% endif %}> Guest</label>
        </div>

        <div id="name-section">
            <input type="text" name="name" id="name_field" placeholder="Full Name" value="{{ name_val }}">
        </div>

        <div id="id-section">
            <input type="text" name="id_number" id="id_field" placeholder="Student ID Number" value="{{ id_val }}">
        </div>

        <button type="button" onclick="verifyEntry()">Login</button>
    </form>
</div>

<div id="studentModal" class="modal-overlay">
    <div class="modal-card">
        <h3 class="modal-title">Is this your name?</h3>
        <h1 id="pulled_name" class="modal-name"></h1>
        
        <div class="modal-actions">
            <button type="button" onclick="confirmStudent()" class="btn btn-yes">YES</button>
            <button type="button" onclick="closeStudentModal()" class="btn btn-no">NO</button>
        </div>
    </div>
</div>

<div id="successModal" class="modal-overlay success-bg">
    <div class="modal-card success-card">
        <div class="success-icon">✓</div>
        <h2 class="success-title">Success!</h2>
        <p id="success_message_text" class="success-text"></p>
        <button type="button" onclick="closeSuccessModal()" class="btn btn-ok">OK</button>
    </div>
</div>

<script>
    // --- Handle "Enter" Key Submission ---
    document.getElementById('main-form').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); 
            verifyEntry(); 
        }
    });

    // Added 'isInitialLoad' to prevent wiping out Django server errors on page refresh
    function toggleFields(role, isInitialLoad = false) {
        const idSection = document.getElementById('id-section');
        const nameSection = document.getElementById('name-section');
        const idField = document.getElementById('id_field');
        const nameField = document.getElementById('name_field');
        const jsMessage = document.getElementById('js-message');

        // ONLY clear errors if the user is actively clicking to switch tabs manually
        if (!isInitialLoad) {
            if (jsMessage) jsMessage.style.display = 'none';
            document.querySelectorAll('.server-error').forEach(msg => msg.style.display = 'none');
        }

        if (role === 'guest' || role === 'GUEST') {
            idSection.style.display = 'none';
            idField.required = false;
            nameSection.style.display = 'block';
            nameField.required = true;
        } else {
            idSection.style.display = 'block';
            idField.required = true;
            nameSection.style.display = 'none';
            nameField.required = false;
        }
    }

    window.onload = function() {
        // Pass 'true' so it knows this is the first load and leaves the errors alone!
        const selectedRole = "{{ selected_role|default:'STUDENT' }}".toLowerCase();
        toggleFields(selectedRole, true);

        let successMessage = "";
        {% if messages %}
            {% for message in messages %}
                {% if "success" in message.tags %}
                    successMessage = "{{ message|escapejs }}";
                {% endif %}
            {% endfor %}
        {% endif %}

        if (successMessage !== "") {
            document.getElementById('success_message_text').innerText = successMessage;
            document.getElementById('successModal').style.display = 'flex';
        }
    };

    function verifyEntry() {
        const idInput = document.getElementById('id_field').value;
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        
        // Clear previous errors on new click
        document.getElementById('js-message').style.display = 'none';
        document.querySelectorAll('.server-error').forEach(msg => msg.style.display = 'none');

        if (selectedRole === 'GUEST') {
            const nameInput = document.getElementById('name_field').value;
            if (!nameInput) {
                showJsError("Please enter your name.");
                return;
            }
            // Instant frontend check for numbers in the Guest Name
            if (/[0-9]/.test(nameInput)) {
                showJsError("Only letters and spaces are allowed.");
                return;
            }
            document.getElementById('main-form').submit();
            return;
        }

        if (!idInput) {
            showJsError("Please enter your Student ID.");
            return;
        }

        if (/[a-zA-Z]/.test(idInput)) {
            showJsError("ID Number must contain only numbers.");
            return;
        }

        fetch(`/lookup/?id_number=${idInput}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('pulled_name').innerText = data.name;
                    document.getElementById('studentModal').style.display = 'flex';
                } else {
                    showJsError("Student ID not found in the master list.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showJsError("An error occurred. Please check the server.");
            });
    }

    function showJsError(messageText) {
        const jsMessage = document.getElementById('js-message');
        jsMessage.innerText = messageText;
        jsMessage.style.display = 'block';
    }

    function confirmStudent() {
        document.getElementById('main-form').submit();
    }

    function closeStudentModal() {
        document.getElementById('studentModal').style.display = 'none';
        document.getElementById('id_field').value = "";
        document.getElementById('id_field').focus();
    }

    function closeSuccessModal() {
        document.getElementById('successModal').style.display = 'none';
        // Clear fields on OK
        document.getElementById('id_field').value = "";
        document.getElementById('name_field').value = "";
    }
</script>
</body>
</html>
